name: Stickiest PHP

on: [workflow_dispatch, push, pull_request]

permissions:
  contents: read

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_backend.yml@83ea68baa2a5ba6abafbdcb8628be69bacabd19e # 2.x
    with:
      enable_backend_testing: true
      enable_phpstan: true
      max_parallel: 4
      runner_type: ubuntu-24.04

      backend_directory: .
