name: CI

on:
  push:
    branches: [ "1.x" ]
  pull_request:
    branches: [ "1.x" ]

jobs:
  test:
    name: PHP ${{ matrix.php }} — ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
        db: ["mysql", "mariadb"]
        include:
          - db: mysql
            db_image: "mysql:8.0"
            db_port: 3306
          - db: mariadb
            db_image: "mariadb:10.11"
            db_port: 3306

    services:
      database:
        image: ${{ matrix.db_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flarum_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Setup test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: flarum_test
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_PREFIX: flarum_
          FLARUM_TEST_TMP_DIR_LOCAL: /tmp/flarum-test
        run: composer test:setup

      - name: Run integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: flarum_test
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_PREFIX: flarum_
          FLARUM_TEST_TMP_DIR_LOCAL: /tmp/flarum-test
        run: composer test:integration

  lint:
    name: PHP CS Fixer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        continue-on-error: true